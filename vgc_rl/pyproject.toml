[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vgc-rl"
version = "0.1.0"
description = "VGC RL helpers and oracle-backed Gymnasium env scaffolding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vgc-rl = "vgc_rl.cli:main"
vgc-rl-replay-viewer = "vgc_rl.replay_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vgc_rl"]

[tool.setuptools.package-data]
vgc_rl = ["examples/*.json", "examples/*.txt", "examples/*.md", "replay_viewer/*"]
